services:
  sync-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sync-folders:latest
    container_name: sync-folders-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_APP=app
      - FLASK_ENV=${FLASK_ENV:-production}
      - PYTHONUNBUFFERED=1
      # Mode conteneur pour la synchronisation
      - SYNC_MODE=container
    volumes:
      # Volumes pour les dossiers de l'application
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Configuration réseau personnalisée
networks:
  default:
    driver: bridge

